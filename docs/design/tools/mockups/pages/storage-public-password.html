<!-- title: Storage, public share page (password) -->
<!-- app: storage -->
<!-- shell: public -->
<style>
  .guest { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr; }
  .guest__bar { display: flex; align-items: center; gap: var(--sp-3); height: var(--topbar-h); padding: 0 var(--sp-4) 0 0; background: var(--surface); border-bottom: 1px solid var(--line); }
  .gate { width: min(26rem, 100%); margin: 0 auto; padding: var(--sp-8) var(--gutter); display: flex; flex-direction: column; gap: var(--sp-5); }
  .gate h1 { font-size: var(--fs-6); }
</style>
<div class="guest">
  <header class="guest__bar">
    <span class="topbar__app" style="height:100%">Storage</span>
    <span class="muted text-2">Shared by Alice</span>
    <span class="topbar__spacer"></span>
    <a class="topbar__link text-2" href="#">Sign in</a>
  </header>
  <main class="gate">
    <div class="row" style="gap: var(--sp-3)">
      <svg class="ficon ficon--pdf ficon--lg"><use href="#f-page"/><text class="ficon__ext" x="10" y="19" style="font-size:5.5px">PDF</text></svg>
      <div>
        <h1>lease-2027-draft.pdf</h1>
        <p class="muted">1.8 MB, 6 pages. This file has a password.</p>
      </div>
    </div>
    <form class="stack" onsubmit="return false">
      <label class="field">
        <span class="field__label">Password</span>
        <input class="input input--lg" type="password" autocomplete="off" aria-invalid="true" aria-describedby="pw-e" value="lease2026">
        <span class="field__error" id="pw-e">That password didn't match. Ask Alice for the current one.</span>
      </label>
      <button class="btn btn--lg btn--primary btn--block">Open file</button>
    </form>
    <p class="text-2 faint">Three wrong tries in a row lock this link for ten minutes.</p>
  </main>
</div>

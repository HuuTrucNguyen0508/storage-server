worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 1k;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # $request_time is seconds with millisecond precision; turn it into an integer of ms.
  map $request_time $duration_ms {
    ~^0\.0*(?<ms>\d+)$         $ms;
    "~^(?<s>[1-9]\d*)\.(?<f>\d{3})$"  $s$f;
    default                    0;
  }
  map $status $log_level { ~^5 error; ~^4 warn; default info; }
  # Only pass identity values with a safe character set into the /api/me JSON.
  map $http_remote_user   $me_user   { "~^[A-Za-z0-9._@-]{1,64}$" $http_remote_user;   default ""; }
  map $http_remote_groups $me_groups { "~^[A-Za-z0-9._,-]{1,256}$" $http_remote_groups; default ""; }
  map $http_remote_email  $me_email  { "~^[A-Za-z0-9._+@-]{1,254}$" $http_remote_email; default ""; }
  map $http_remote_name   $me_name   { "~^[A-Za-z0-9 ._'-]{1,64}$" $http_remote_name; default ""; }

  log_format json escape=json '{"time":"$time_iso8601","level":"$log_level","msg":"request","service":"home",'
    '"user":"$me_user","method":"$request_method","route":"$uri","path":"$uri","status":$status,'
    '"duration_ms":$duration_ms,"bytes":$body_bytes_sent}';
  access_log /dev/stdout json;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /readyz  { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Signed-in user, from the identity headers Authelia sets (sso-chain strips client copies).
    location = /api/me {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;
      default_type application/json;
      if ($me_user = "") { return 401 '{"error":"not signed in"}'; }
      return 200 '{"user":"$me_user","name":"$me_name","email":"$me_email","groups":"$me_groups"}';
    }

    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ =404;
    }
  }
}

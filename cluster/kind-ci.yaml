# Single-node kind cluster for PROFILE=ci (GitHub Actions). Same port contract as kind.yaml.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ${CLUSTER_NAME}
nodes:
  - role: control-plane
    image: ${KIND_NODE_IMAGE}
    labels:
      ingress-ready: "true"
    extraMounts:
      - hostPath: ${DATA_DIR}
        containerPath: /data
    extraPortMappings:
      - containerPort: 30080
        hostPort: ${HTTP_PORT}
        listenAddress: "${LISTEN_ADDRESS}"
        protocol: TCP
      - containerPort: 30443
        hostPort: ${HTTPS_PORT}
        listenAddress: "${LISTEN_ADDRESS}"
        protocol: TCP

# Authelia configuration (rendered by scripts/lib.sh render; secrets come from *_FILE env vars).
theme: auto
server:
  address: tcp://:9091/
  # The Docker HEALTHCHECK helper writes /app/.healthcheck.env, which a read-only root
  # filesystem forbids; Kubernetes probes use /api/health instead.
  disable_healthcheck: true
  endpoints:
    authz:
      forward-auth:
        implementation: ForwardAuth
log:
  level: info
  format: json
telemetry:
  metrics:
    enabled: true
    address: tcp://:9959/metrics
totp:
  issuer: ${DOMAIN}
webauthn:
  disable: false
  display_name: Lab
authentication_backend:
  password_reset:
    disable: true
  password_change:
    disable: true
  file:
    path: /config/users/users_database.yml
    watch: true
    search:
      email: false
      case_insensitive: false
    password:
      algorithm: argon2
      argon2:
        variant: argon2id
password_policy:
  standard:
    enabled: true
    min_length: 12
access_control:
  default_policy: deny
  rules:
    # The load generator account always logs in with one factor, on user apps only.
    - domain: ["home.${DOMAIN}", "storage.${DOMAIN}", "todo.${DOMAIN}", "pdf.${DOMAIN}", "whoami.${DOMAIN}"]
      subject: ["user:loadgen"]
      policy: one_factor
    - domain: ["grafana.${DOMAIN}", "prometheus.${DOMAIN}", "alertmanager.${DOMAIN}", "traefik.${DOMAIN}"]
      subject: ["group:admins"]
      policy: ${AUTH_POLICY}
    # whoami.${DOMAIN} only exists while `make smoke` runs.
    - domain: ["home.${DOMAIN}", "storage.${DOMAIN}", "todo.${DOMAIN}", "pdf.${DOMAIN}", "whoami.${DOMAIN}"]
      subject: ["group:users"]
      policy: ${AUTH_POLICY}
session:
  name: authelia_session
  same_site: lax
  inactivity: 2h
  expiration: 12h
  remember_me: 30d
  cookies:
    - domain: ${DOMAIN}
      authelia_url: ${AUTH_PUBLIC_URL}
      default_redirection_url: ${HOME_URL}
regulation:
  modes: [user]
  max_retries: 5
  find_time: 2m
  ban_time: 10m
storage:
  local:
    path: /var/lib/authelia/db.sqlite3
notifier:
  disable_startup_check: true
  filesystem:
    filename: /var/lib/authelia/notification.txt
ntp:
  disable_startup_check: true

<!-- title: Storage, viewer (image) -->
<!-- app: storage -->
<!-- shell: viewer -->
<div class="viewer" role="dialog" aria-label="living-room-01.jpg">
  <div class="viewer__bar">
    <button class="btn btn--quiet btn--icon" aria-label="Back to Flat photos"><svg class="icon"><use href="#i-arrow-l"/></svg></button>
    <div class="viewer__title"><svg class="ficon ficon--image hide-sm"><use href="#f-page"/><text class="ficon__ext" x="10" y="19">JPG</text></svg><span class="truncate">living-room-01.jpg</span><span class="faint text-2 hide-sm">3.1 MB, 4032 × 3024, 28 Oct</span></div>
    <span class="viewer__pager hide-sm">2 of 31</span>
    <div class="btn-group hide-sm" role="group" aria-label="Zoom">
      <button class="btn btn--icon" aria-label="Zoom out"><svg class="icon"><use href="#i-zoom-out"/></svg></button>
      <button class="btn btn--icon" aria-pressed="true" aria-label="Fit"><svg class="icon"><use href="#i-fit"/></svg></button>
      <button class="btn btn--icon" aria-label="Zoom in"><svg class="icon"><use href="#i-zoom-in"/></svg></button>
    </div>
    <button class="btn hide-sm"><svg class="icon"><use href="#i-share"/></svg>Share</button>
    <button class="btn"><svg class="icon"><use href="#i-download"/></svg><span class="hide-sm">Download</span></button>
    <button class="btn btn--quiet btn--icon" aria-label="More"><svg class="icon"><use href="#i-more"/></svg></button>
  </div>
  <div class="viewer__stage viewer__stage--media" style="position:relative">
    <div class="ph-big" role="img" aria-label="Living room with a large window"></div>
    <button class="viewer__nav viewer__nav--prev" aria-label="Previous"><svg class="icon"><use href="#i-chev-l"/></svg></button>
    <button class="viewer__nav viewer__nav--next" aria-label="Next"><svg class="icon"><use href="#i-chev-r"/></svg></button>
  </div>
</div>

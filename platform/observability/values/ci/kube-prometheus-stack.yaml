# PROFILE=ci overlay (GitHub Actions: 16 GB RAM, 14 GB disk): short retention, small volumes
# and requests. Applied on top of ../kube-prometheus-stack.yaml.
prometheus:
  prometheusSpec:
    retention: 1d
    retentionSize: 1500MB
    exemplars:
      maxSize: 20000
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {memory: 1536Mi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi
alertmanager:
  alertmanagerSpec:
    retention: 24h
grafana:
  persistence:
    enabled: false
  resources:
    requests: {cpu: 20m, memory: 192Mi}
    limits: {memory: 768Mi}

# Traefik takes client traffic from anywhere on web/websecure; metrics only from Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik
  namespace: traefik
  labels: {app.kubernetes.io/name: traefik, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: ingress}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: 8000, protocol: TCP}
        - {port: 8443, protocol: TCP}
        - {port: 8080, protocol: TCP}   # ping (kubelet probes)
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{port: 9100, protocol: TCP}]

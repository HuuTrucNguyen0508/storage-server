apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo
  namespace: todo
  labels: {app.kubernetes.io/name: todo, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: api}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: todo, app.kubernetes.io/component: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: todo, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: api}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: lab/todo:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}, {name: metrics, containerPort: 9464}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: todo-db-app, key: uri}}
            - {name: EXPECTED_ORIGIN, value: 'https://todo.${DOMAIN}'}
            - {name: AUTH_PUBLIC_URL, value: '${AUTH_PUBLIC_URL}'}
            - {name: HOME_URL, value: '${HOME_URL}'}
            - {name: AUTH_MODE, value: header}
            - {name: APP_ENV, value: production}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: 'http://alloy.monitoring.svc.cluster.local:4318'}
            - {name: OTEL_SERVICE_NAME, value: todo}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: 'deployment.environment=${ENVIRONMENT},service.namespace=lab'}
          startupProbe: {httpGet: {path: /readyz, port: http}, failureThreshold: 120, periodSeconds: 2}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: todo
  namespace: todo
  labels: {app.kubernetes.io/name: todo, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: api}
spec:
  selector: {app.kubernetes.io/name: todo, app.kubernetes.io/component: api}
  ports: [{name: http, port: 8080, targetPort: http}, {name: metrics, port: 9464, targetPort: metrics}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: todo, namespace: todo, labels: {app.kubernetes.io/component: api}}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: todo, app.kubernetes.io/component: api}}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: todo, namespace: todo, labels: {app.kubernetes.io/component: api}}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: todo, app.kubernetes.io/component: api}}
  endpoints: [{port: metrics, interval: 15s}]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: todo, namespace: todo, labels: {app.kubernetes.io/component: api}}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`todo.${DOMAIN}`)
      kind: Rule
      middlewares: [{name: auth-sso-chain@kubernetescrd}]
      services:
        - name: todo
          port: 8080
          responseForwarding: {flushInterval: '-1ms'}
  tls: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: todo-api, namespace: todo, labels: {app.kubernetes.io/component: network}}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: todo, app.kubernetes.io/component: api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: traefik}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports: [{port: 8080, protocol: TCP}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{port: 9464, protocol: TCP}]

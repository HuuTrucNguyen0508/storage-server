# Admin UIs behind Authelia. Authelia's access control lets only group `admins` through
# (platform/auth/configuration.yml). Rendered with scripts/lib.sh `render`.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
  labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: dashboards}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`grafana.${DOMAIN}`)
      kind: Rule
      middlewares:
        - name: sso-chain
          namespace: auth
      services:
        - {name: grafana, port: 80}
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus
  namespace: monitoring
  labels: {app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: metrics}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`prometheus.${DOMAIN}`)
      kind: Rule
      middlewares:
        - name: sso-chain
          namespace: auth
      services:
        - {name: prometheus, port: 9090}
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: alertmanager
  namespace: monitoring
  labels: {app.kubernetes.io/name: alertmanager, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: alerting}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`alertmanager.${DOMAIN}`)
      kind: Rule
      middlewares:
        - name: sso-chain
          namespace: auth
      services:
        - {name: alertmanager, port: 9093}
  tls: {}

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  app:
    <<: *hardened
    build: .
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      ROOT_DIR: /data
      STATE_DIR: /state
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      SHARE_URL: ${SHARE_URL:-http://localhost:8080}
      MIN_FREE_BYTES: ${MIN_FREE_BYTES:-5368709120}
    volumes:
      - type: bind
        source: ${STORAGE_ROOT:?set STORAGE_ROOT in .env}
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: ${STATE_DIR:?create STATE_DIR and chown it to PUID before starting}
        target: /state
        bind: {create_host_path: false}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/storage-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  tailscale:
    <<: *hardened
    profiles: [tailscale]
    image: tailscale/tailscale:v1.90.6
    user: "${PUID:-1000}:${PGID:-1000}"
    hostname: ${TS_HOSTNAME:-storage}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /state
      TS_SOCKET: /tmp/tailscaled.sock
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
      TS_SERVE_CONFIG: /config/${TS_EXPOSE:-tailnet}.json
    tmpfs: [/tmp, /var/run]
    volumes:
      - type: bind
        source: ${TS_STATE_DIR:-./tailscale-state}
        target: /state
        bind: {create_host_path: false}
      - ./deploy/tailscale:/config:ro

  pdf:
    <<: *hardened
    profiles: [pdf]
    image: stirlingtools/stirling-pdf:1.6.0
    user: "1000:1000"
    entrypoint: ["java", "-Djava.io.tmpdir=/tmp", "-jar", "/app.jar"]
    environment:
      HOME: /tmp
      SYSTEM_ROOTURIPATH: /pdf
      SECURITY_ENABLELOGIN: "false"
      DISABLE_ADDITIONAL_FEATURES: "true"
    working_dir: /tmp
    tmpfs: [/tmp, "/configs:uid=1000,gid=1000", "/logs:uid=1000,gid=1000"]
    ports:
      - "127.0.0.1:${PDF_PORT:-8082}:8080"

  prometheus:
    <<: *hardened
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0
    user: "65534:65534"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"

  grafana:
    <<: *hardened
    profiles: [monitoring]
    image: grafana/grafana:12.2.1
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set a unique GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    tmpfs: [/tmp]
    volumes:
      - grafana:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

volumes:
  prometheus:
  grafana:

# CI for the lab platform. Fast checks run in parallel; the kind end-to-end job starts only
# when they pass, because it takes about half an hour. Every third-party action is pinned
# by commit SHA (the comment names the release) and every downloaded tool by SHA-256.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "26.13.0" # the version the Dockerfiles use
  # Pinned release binaries (checksums are from the releases' own digests).
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  KUBECONFORM_VERSION: "0.8.0"
  KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"

jobs:
  storage-go:
    name: storage (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/storage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/storage/go.mod
          cache-dependency-path: services/storage/go.sum
      - name: go vet
        run: go vet ./...
      # The integration tests start a throwaway postgres:18.6 container (Docker is on the runner).
      - name: go test -race
        run: go test -race -count=1 ./...

  storage-web:
    name: storage (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/storage/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (reads packageManager from the root package.json)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  todo-api:
    name: todo (API)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/todo/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # The tests start a throwaway postgres:18.6-alpine3.24 container.
      - run: pnpm test

  todo-web:
    name: todo (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/todo/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e-package:
    name: e2e suite (typecheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  observability:
    name: observability (rules, dashboards)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Alert rules (promtool in the pinned Prometheus image)
        run: bash platform/observability/rules/test.sh
      - name: Synthetic-check alert rules
        run: bash loadgen/test-rules.sh
      - name: Dashboards are generated from build.mjs and committed
        run: |
          node platform/observability/dashboards/build.mjs
          git diff --exit-code -- platform/observability/dashboards \
            || { echo "::error::dashboard JSON is stale: run node platform/observability/dashboards/build.mjs and commit"; exit 1; }

  shell:
    name: shell scripts (shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          curl -fsSL --retry 3 -o shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          sudo install -m 0755 shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - name: shellcheck
        run: |
          mapfile -d '' files < <(find scripts loadgen platform -name '*.sh' -not -path '*/node_modules/*' -print0 | sort -z)
          files+=(tests/e2e/run.sh)
          printf '%s\n' "${files[@]}"
          shellcheck -x -S warning "${files[@]}"

  manifests:
    name: manifests (kustomize, render, schema)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install kubeconform ${{ env.KUBECONFORM_VERSION }}
        run: |
          curl -fsSL --retry 3 -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
      # Builds every kustomization the way scripts/deploy-app.sh and loadgen/install.sh do,
      # renders the platform manifests with the same envsubst allowlist (scripts/lib.sh),
      # refuses an empty image reference, and checks the result against the Kubernetes
      # schemas. Custom resources (Traefik, CloudNativePG, Prometheus Operator) have no
      # schema here and are skipped.
      - name: kubectl kustomize, render, kubeconform
        run: |
          set -euo pipefail
          . scripts/lib.sh
          export IMAGE_TAG=0123456789abcdef
          out=$(mktemp -d)
          n=0
          while IFS= read -r kf; do
            dir=$(dirname "$kf")
            kubectl kustomize --load-restrictor LoadRestrictionsNone "$dir" | render > "$out/${dir//\//-}.yaml"
            n=$((n + 1))
          done < <(find services loadgen -name kustomization.yaml -not -path '*/node_modules/*' | sort)
          for f in platform/namespaces/namespaces.yaml platform/storage/storage.yaml platform/stirling-pdf/stirling-pdf.yaml \
                   platform/smoke/*.yaml platform/traefik/networkpolicy.yaml platform/auth/authelia.yaml \
                   platform/observability/manifests/*.yaml; do
            AUTHELIA_CONFIG_HASH=ci RENDER_VARS="$RENDER_VARS AUTHELIA_CONFIG_HASH" render "$f" > "$out/$(echo "$f" | tr / -)"
            n=$((n + 1))
          done
          echo "rendered $n manifests"
          bad=0
          for f in "$out"/*.yaml; do
            [ -s "$f" ] || { echo "::error::$f is empty"; bad=1; }
            if grep -nE '^[ -]*image: *"?([^ "]*:)?"?$' "$f"; then echo "::error::$f has an empty image or tag"; bad=1; fi
          done
          [ "$bad" = 0 ]
          kubeconform -strict -ignore-missing-schemas -summary "$out"/*.yaml

  workflows:
    name: workflows (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint ${{ env.ACTIONLINT_VERSION }}
        run: |
          curl -fsSL --retry 3 -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  kind-e2e:
    name: kind end-to-end (up, smoke, e2e, load-smoke)
    needs: [storage-go, storage-web, todo-api, todo-web, e2e-package, observability, shell, manifests, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PROFILE: ci # single-node kind cluster (cluster/kind-ci.yaml) and smaller retention
      CI_DOMAIN: lab.localhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Free disk space (the runner has about 14 GB free; the stack needs more)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Prepare the host (ports, hosts file, inotify limits)
        run: |
          # kind maps host ports 80 and 443 to Traefik; stop anything that may hold them.
          sudo systemctl stop apache2 nginx 2>/dev/null || true
          if sudo ss -ltn '( sport = :80 or sport = :443 )' | grep -q LISTEN; then
            sudo ss -ltnp '( sport = :80 or sport = :443 )'
            echo "::error::port 80 or 443 is already in use on the runner"; exit 1
          fi
          # The browser treats *.localhost as loopback; Node (Playwright's API client) uses the
          # system resolver, which does not do that on the runner image.
          h="${CI_DOMAIN}"; for s in home auth storage todo pdf grafana prometheus alertmanager traefik whoami; do h="$h $s.${CI_DOMAIN}"; done
          echo "127.0.0.1 $h" | sudo tee -a /etc/hosts
          # Many pods tail files and watch config: the default inotify limits run out.
          sudo sysctl -w fs.inotify.max_user_watches=524288 fs.inotify.max_user_instances=1024
          docker version --format 'docker {{.Server.Version}}'
          docker info --format 'storage driver: {{.Driver}}'
          docker buildx version || true
          helm version --short
          kubectl version --client
          nproc; free -h

      - name: make up (cluster, platform, observability, apps)
        timeout-minutes: 45
        run: make up

      - name: Wait for every workload and every app URL
        timeout-minutes: 15
        run: |
          set -euo pipefail
          export KUBECONFIG="$PWD/.local/kubeconfig"
          K=".local/bin/kubectl"
          deadline=$((SECONDS + 600))
          # Pods of finished or retried Jobs (namespace loadgen) are not workloads.
          until [ -z "$($K get pods -A --no-headers | awk '$1 != "loadgen" && $4 != "Running" && $4 != "Completed" {print}')" ] \
             && [ -z "$($K get pods -A --no-headers | awk '$1 != "loadgen" && $4 == "Running" { split($3, r, "/"); if (r[1] != r[2]) print }')" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then echo "::error::pods are not all ready"; $K get pods -A -o wide; exit 1; fi
            sleep 10
          done
          $K wait --for=condition=Available deployment --all -A --timeout=300s
          for h in home auth storage todo pdf grafana; do
            until code=$(curl -ksS -o /dev/null -w '%{http_code}' "https://${h}.${CI_DOMAIN}/") && [ "$code" != 000 ] && [ "$code" -lt 500 ]; do
              if [ "$SECONDS" -ge "$deadline" ]; then echo "::error::${h}.${CI_DOMAIN} answers $code"; exit 1; fi
              sleep 5
            done
            echo "${h}.${CI_DOMAIN}: $code"
          done
          make status

      - name: make smoke
        timeout-minutes: 15
        run: make smoke

      - name: make e2e
        timeout-minutes: 20
        env:
          INSTALL_BROWSER: "1"
        run: make e2e

      - name: make load-smoke
        timeout-minutes: 15
        run: make load-smoke

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics/logs
          export KUBECONFIG="$PWD/.local/kubeconfig"
          K=".local/bin/kubectl"
          $K get events -A --sort-by=.lastTimestamp > diagnostics/events.txt 2>&1 || true
          $K get pods -A -o wide > diagnostics/pods.txt 2>&1 || true
          $K describe pods -A > diagnostics/describe-pods.txt 2>&1 || true
          $K get ingressroute,certificate,pvc,pv -A > diagnostics/objects.txt 2>&1 || true
          make status > diagnostics/make-status.txt 2>&1 || true
          df -h > diagnostics/df.txt 2>&1 || true
          free -h > diagnostics/free.txt 2>&1 || true
          $K get pods -A -o json 2>/dev/null | jq -r '.items[] | "\(.metadata.namespace) \(.metadata.name)"' | while read -r ns pod; do
            $K -n "$ns" logs "$pod" --all-containers --prefix --tail=2000 > "diagnostics/logs/${ns}_${pod}.log" 2>&1 || true
            $K -n "$ns" logs "$pod" --all-containers --prefix --previous --tail=500 > "diagnostics/logs/${ns}_${pod}.previous.log" 2>/dev/null || rm -f "diagnostics/logs/${ns}_${pod}.previous.log"
          done

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kind-e2e-diagnostics
          path: |
            diagnostics/
            tests/e2e/test-results/
            tests/e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

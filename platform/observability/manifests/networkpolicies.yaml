# Default: no ingress to any pod in monitoring. Egress stays open (contract).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: monitoring
  labels: {app.kubernetes.io/name: monitoring, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: network-policy}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Grafana UI from Traefik; metrics from Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
  namespace: monitoring
  labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: network-policy}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: grafana}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: traefik}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports: [{port: 3000, protocol: TCP}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{port: 3000, protocol: TCP}]
---
# Prometheus UI from Traefik; queries from Grafana; remote write from Tempo, Alloy and k6 in loadgen; self-scrape and config-reloader metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus
  namespace: monitoring
  labels: {app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: network-policy}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: prometheus}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: traefik}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: grafana}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: tempo}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: alloy}}
      ports: [{port: 9090, protocol: TCP}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: loadgen}}
      ports: [{port: 9090, protocol: TCP}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{port: 8080, protocol: TCP}]
---
# Alertmanager UI from Traefik; alerts from Prometheus; Grafana's Alertmanager datasource.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager
  namespace: monitoring
  labels: {app.kubernetes.io/name: alertmanager, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: network-policy}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: alertmanager}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: traefik}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: grafana}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{port: 9093, protocol: TCP}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{port: 8080, protocol: TCP}]
---
# OTLP into Alloy from every namespace (traces from Traefik, Grafana and the apps);
# Alloy's own metrics from Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy
  namespace: monitoring
  labels: {app.kubernetes.io/name: alloy, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: network-policy}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: alloy}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports: [{port: 4317, protocol: TCP}, {port: 4318, protocol: TCP}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{port: 12345, protocol: TCP}]
---
# Loki: pushes from Alloy, queries from Grafana, metrics from Prometheus; its own gRPC and memberlist.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki
  namespace: monitoring
  labels: {app.kubernetes.io/name: loki, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: network-policy}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: loki}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: alloy}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: grafana}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{port: 3100, protocol: TCP}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: loki}}
      ports: [{port: 3100, protocol: TCP}, {port: 9095, protocol: TCP}, {port: 7946, protocol: TCP}]
---
# Tempo: spans from Alloy, queries from Grafana, metrics from Prometheus; its own gRPC and memberlist.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo
  namespace: monitoring
  labels: {app.kubernetes.io/name: tempo, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: network-policy}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: tempo}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: alloy}}
      ports: [{port: 4317, protocol: TCP}, {port: 4318, protocol: TCP}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: grafana}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{port: 3200, protocol: TCP}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: tempo}}
      ports: [{port: 3200, protocol: TCP}, {port: 9095, protocol: TCP}, {port: 7946, protocol: TCP}]
---
# Blackbox exporter: probe requests and metrics from Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels: {app.kubernetes.io/name: prometheus-blackbox-exporter, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: network-policy}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: prometheus-blackbox-exporter}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{port: 9115, protocol: TCP}]
---
# Webhook sink: notifications from Alertmanager.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alert-sink
  namespace: monitoring
  labels: {app.kubernetes.io/name: alert-sink, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: network-policy}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: alert-sink}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: alertmanager}}
      ports: [{port: 8080, protocol: TCP}]
---
# kube-state-metrics: scraped by Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels: {app.kubernetes.io/name: kube-state-metrics, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: network-policy}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: kube-state-metrics}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{port: 8080, protocol: TCP}, {port: 8081, protocol: TCP}]
---
# node-exporter runs on the host network, where NetworkPolicy doesn't apply; listed for completeness.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: node-exporter
  namespace: monitoring
  labels: {app.kubernetes.io/name: prometheus-node-exporter, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: network-policy}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: prometheus-node-exporter}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{port: 9100, protocol: TCP}]
---
# Operator: admission webhooks are called by the API server from the node network, so the
# webhook port is open to any source (TLS, validation only). Prometheus scrapes it too.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-operator
  namespace: monitoring
  labels: {app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: network-policy}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 10250, protocol: TCP}]
---
# metrics-server: the API server calls it (APIService v1beta1.metrics.k8s.io) from the
# node network, so its port is open to any source (TLS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-server
  namespace: monitoring
  labels: {app.kubernetes.io/name: metrics-server, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: network-policy}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: metrics-server}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 10250, protocol: TCP}]

# metrics-server (chart version pinned in install.sh): the resource metrics API behind
# `kubectl top` and HorizontalPodAutoscalers. k3s's own metrics-server is disabled
# (cluster/k3s.yaml), so this one serves the API. k3s's kubelet serves a certificate
# signed by k3s's own CA, hence --kubelet-insecure-tls (single-node lab cluster).
fullnameOverride: metrics-server
args:
  - --kubelet-insecure-tls
  - --kubelet-preferred-address-types=InternalIP
podLabels:
  app.kubernetes.io/part-of: lab
resources:
  requests: {cpu: 20m, memory: 48Mi}
  limits: {memory: 192Mi}

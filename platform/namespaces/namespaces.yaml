# Every namespace the platform contract names, with Pod Security labels.
# App deploy folders must not ship their own Namespace objects.
# `pdf` is baseline: Stirling PDF's entrypoint starts as root and drops to its own
# users with setpriv (LibreOffice runs as a separate sandboxed user).
# `traefik` and `auth` run fully restricted. `cnpg-system` runs restricted (operator chart).
apiVersion: v1
kind: Namespace
metadata:
  name: home
  labels:
    app.kubernetes.io/part-of: lab
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---

# Lab alerting and recording rules, in plain Prometheus rule-file format so promtool can
# unit test them (rules/test.sh, cases in rules/lab.rules.test.yaml). install.sh wraps
# this file into the PrometheusRule `lab-rules` in namespace monitoring.
#
# The `app` label is the probe URL's first host label (home, auth, storage, todo, pdf,
# grafana, prometheus, alertmanager, traefik) or, for Traefik metrics, derived from the
# Traefik service name `<namespace>-<service>-<hash>@kubernetescrd` (Prometheus renames
# Traefik's `service` label to `exported_service` because the scrape target has one too).
groups:
  - name: lab.traefik.recording
    rules:
      - record: app_code:traefik_requests:rate5m
        expr: |
          sum by (app, code) (
            label_replace(
              label_replace(rate(traefik_service_requests_total[5m]),
                "app", "$1", "exported_service", "^(home|auth|storage|todo|pdf)-.*"),
              "app", "$1", "exported_service", "^monitoring-(?:kps-)?(grafana|prometheus|alertmanager)-.*")
          )
      - record: app:traefik_requests:rate5m
        expr: sum by (app) (app_code:traefik_requests:rate5m)
      - record: app:traefik_requests_5xx:ratio_rate5m
        expr: |
          sum by (app) (app_code:traefik_requests:rate5m{code=~"5.."})
            /
          sum by (app) (app_code:traefik_requests:rate5m)
      - record: app_le:traefik_request_duration_seconds_bucket:rate5m
        expr: |
          sum by (app, le) (
            label_replace(
              label_replace(rate(traefik_service_request_duration_seconds_bucket[5m]),
                "app", "$1", "exported_service", "^(home|auth|storage|todo|pdf)-.*"),
              "app", "$1", "exported_service", "^monitoring-(?:kps-)?(grafana|prometheus|alertmanager)-.*")
          )
      - record: app:traefik_request_duration_seconds:p95_5m
        expr: histogram_quantile(0.95, app_le:traefik_request_duration_seconds_bucket:rate5m)

  # SLO: 99.5% of storage and todo requests through Traefik are not 5xx (error budget 0.5%).
  - name: lab.slo.recording
    rules:
      - record: app:slo_errors:ratio_rate5m
        expr: |
          sum by (app) (label_replace(rate(traefik_service_requests_total{exported_service=~"(storage|todo)-.*", code=~"5.."}[5m]), "app", "$1", "exported_service", "^(storage|todo)-.*"))
            /
          sum by (app) (label_replace(rate(traefik_service_requests_total{exported_service=~"(storage|todo)-.*"}[5m]), "app", "$1", "exported_service", "^(storage|todo)-.*"))
      - record: app:slo_errors:ratio_rate30m
        expr: |
          sum by (app) (label_replace(rate(traefik_service_requests_total{exported_service=~"(storage|todo)-.*", code=~"5.."}[30m]), "app", "$1", "exported_service", "^(storage|todo)-.*"))
            /
          sum by (app) (label_replace(rate(traefik_service_requests_total{exported_service=~"(storage|todo)-.*"}[30m]), "app", "$1", "exported_service", "^(storage|todo)-.*"))
      - record: app:slo_errors:ratio_rate1h
        expr: |
          sum by (app) (label_replace(rate(traefik_service_requests_total{exported_service=~"(storage|todo)-.*", code=~"5.."}[1h]), "app", "$1", "exported_service", "^(storage|todo)-.*"))
            /
          sum by (app) (label_replace(rate(traefik_service_requests_total{exported_service=~"(storage|todo)-.*"}[1h]), "app", "$1", "exported_service", "^(storage|todo)-.*"))
      - record: app:slo_errors:ratio_rate2h
        expr: |
          sum by (app) (label_replace(rate(traefik_service_requests_total{exported_service=~"(storage|todo)-.*", code=~"5.."}[2h]), "app", "$1", "exported_service", "^(storage|todo)-.*"))
            /
          sum by (app) (label_replace(rate(traefik_service_requests_total{exported_service=~"(storage|todo)-.*"}[2h]), "app", "$1", "exported_service", "^(storage|todo)-.*"))
      - record: app:slo_errors:ratio_rate6h
        expr: |
          sum by (app) (label_replace(rate(traefik_service_requests_total{exported_service=~"(storage|todo)-.*", code=~"5.."}[6h]), "app", "$1", "exported_service", "^(storage|todo)-.*"))
            /
          sum by (app) (label_replace(rate(traefik_service_requests_total{exported_service=~"(storage|todo)-.*"}[6h]), "app", "$1", "exported_service", "^(storage|todo)-.*"))
      - record: app:slo_errors:ratio_rate1d
        expr: |
          sum by (app) (label_replace(rate(traefik_service_requests_total{exported_service=~"(storage|todo)-.*", code=~"5.."}[1d]), "app", "$1", "exported_service", "^(storage|todo)-.*"))
            /
          sum by (app) (label_replace(rate(traefik_service_requests_total{exported_service=~"(storage|todo)-.*"}[1d]), "app", "$1", "exported_service", "^(storage|todo)-.*"))
      - record: app:slo_errors:ratio_rate3d
        expr: |
          sum by (app) (label_replace(rate(traefik_service_requests_total{exported_service=~"(storage|todo)-.*", code=~"5.."}[3d]), "app", "$1", "exported_service", "^(storage|todo)-.*"))
            /
          sum by (app) (label_replace(rate(traefik_service_requests_total{exported_service=~"(storage|todo)-.*"}[3d]), "app", "$1", "exported_service", "^(storage|todo)-.*"))

  - name: lab.apps
    rules:
      - alert: LabAppDown
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.app }} is down"
          description: "Blackbox probe {{ $labels.instance }} ({{ $labels.job }}) has failed for 2 minutes."
          dashboard: "https://grafana.${DOMAIN}/d/lab-overview"

      # Needs at least one request a minute, so a single 500 on an idle app doesn't page.
      - alert: LabAppHigh5xxRatio
        expr: |
          app:traefik_requests_5xx:ratio_rate5m > 0.05
            and on (app)
          app:traefik_requests:rate5m > 1/60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.app }} returns 5xx for {{ $value | humanizePercentage }} of requests"
          description: "More than 5% of requests to {{ $labels.app }} through Traefik failed with a 5xx status for 5 minutes."

      # Apps we write: their own histogram, without streaming and bulk-transfer routes
      # (server-sent events, uploads, downloads, raw file content), which are slow by design.
      - alert: LabAppHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (namespace, job, le) (
              rate(http_server_request_duration_seconds_bucket{route!~"unmatched|.*(events|stream|upload|download|chunk|content|raw|thumbnail|preview|sse|live).*"}[5m])
            )
          ) > 1
            and on (namespace, job)
          sum by (namespace, job) (rate(http_server_request_duration_seconds_count[5m])) > 1/60
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} p95 latency is {{ $value | humanizeDuration }}"
          description: "p95 latency of {{ $labels.namespace }}/{{ $labels.job }} (excluding streaming and transfer routes) has been above 1s for 10 minutes."

      # Apps without their own HTTP histogram, measured at Traefik. Storage and todo use the
      # rule above (Traefik can't tell an SSE stream or a 2 GiB download from a slow page).
      # Left out: Stirling PDF (conversions take seconds by design) and Grafana (its live
      # websocket stays open for minutes and counts as one long request).
      - alert: LabAppHighLatencyTraefik
        expr: |
          app:traefik_request_duration_seconds:p95_5m{app=~"home|auth|prometheus|alertmanager"} > 1
            and on (app)
          app:traefik_requests:rate5m > 1/60
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.app }} p95 latency is {{ $value | humanizeDuration }}"
          description: "p95 latency of {{ $labels.app }} through Traefik has been above 1s for 10 minutes."

      - alert: LabCertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) < 14 * 86400
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}"
          description: "The certificate served for {{ $labels.instance }} expires in under 14 days. cert-manager should have renewed it; check `kubectl -n traefik describe certificate lab-wildcard`."

      - alert: LabCertManagerCertificateExpiringSoon
        expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < 14 * 86400
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}"
          description: "cert-manager reports the certificate expires in under 14 days."

  - name: lab.slo
    rules:
      # Fast burn: 2% of the 30-day budget in 1 hour, or 5% in 6 hours.
      - alert: LabSLOErrorBudgetBurnFast
        expr: |
          (app:slo_errors:ratio_rate1h > (14.4 * 0.005) and on (app) app:slo_errors:ratio_rate5m > (14.4 * 0.005))
            or
          (app:slo_errors:ratio_rate6h > (6 * 0.005) and on (app) app:slo_errors:ratio_rate30m > (6 * 0.005))
        labels:
          severity: critical
          slo: availability-99.5
        annotations:
          summary: "{{ $labels.app }} is burning its 99.5% availability error budget fast"
          description: "{{ $labels.app }} 5xx ratio is {{ $value | humanizePercentage }}; at this rate the monthly error budget is gone in days."
      # Slow burn: 10% of the budget in 1 day or 3 days.
      - alert: LabSLOErrorBudgetBurnSlow
        expr: |
          (app:slo_errors:ratio_rate1d > (3 * 0.005) and on (app) app:slo_errors:ratio_rate2h > (3 * 0.005))
            or
          (app:slo_errors:ratio_rate3d > (1 * 0.005) and on (app) app:slo_errors:ratio_rate6h > (1 * 0.005))
        labels:
          severity: warning
          slo: availability-99.5
        annotations:
          summary: "{{ $labels.app }} is slowly burning its 99.5% availability error budget"
          description: "{{ $labels.app }} 5xx ratio is {{ $value | humanizePercentage }} over the slow-burn windows."

  - name: lab.kubernetes
    rules:
      - alert: LabPodCrashLooping
        expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is crash looping"
          description: "Container {{ $labels.container }} has been in CrashLoopBackOff for 5 minutes. Logs: {namespace=\"{{ $labels.namespace }}\", pod=\"{{ $labels.pod }}\"} in Loki."

      - alert: LabPersistentVolumeClaimAlmostFull
        expr: |
          kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"
          description: "The volume is more than 85% full."

      # local-path and hostPath volumes report no kubelet_volume_stats, so the rule above
      # stays silent for them. They are directories on the host's own filesystems (PVCs
      # under /var/lib/rancher/k3s/storage, DATA_DIR wherever it is set), so alert on every
      # real host filesystem at the same 85%. Left out: in-memory, overlay and other virtual
      # filesystems, FUSE mounts (fuseblk, a FUSE driver for a local disk, stays), and
      # /boot, /run and /snap. One alert per device: btrfs subvolumes and bind mounts of
      # one filesystem count once.
      - alert: LabHostVolumeAlmostFull
        expr: |
          max by (device) (
            1 - node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs|autofs|fuse|fuse[.].+", mountpoint!~"/(boot|run|snap)(/.*)?"}
              / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs|autofs|fuse|fuse[.].+", mountpoint!~"/(boot|run|snap)(/.*)?"}
          ) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host filesystem {{ $labels.device }} is {{ $value | humanizePercentage }} full"
          description: "A host filesystem is more than 85% full. Persistent volumes, DATA_DIR and container images live on the host's filesystems; `findmnt --source {{ $labels.device }}` shows where this one is mounted."

      - alert: LabStorageVolumeLowFreeSpace
        expr: |
          max by (namespace, job) (storage_volume_free_bytes)
            /
          max by (namespace, job) (storage_volume_size_bytes) < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Storage volume has {{ $value | humanizePercentage }} free"
          description: "storage-data (the host directory under DATA_DIR) has less than 10% free space."

      # Any of: the exporter reports PostgreSQL down, the instance can't be scraped, or the
      # instance pod is not Ready.
      - alert: LabCNPGInstanceDown
        expr: |
          max by (namespace, pod) (cnpg_collector_up) == 0
            or
          max by (namespace, pod) (up{job="monitoring/cnpg-clusters"}) == 0
            or
          max by (namespace, pod) (
            (kube_pod_status_ready{condition="true"} == 0)
              * on (namespace, pod) group_left ()
            kube_pod_labels{label_cnpg_io_cluster!=""}
          )
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL instance {{ $labels.namespace }}/{{ $labels.pod }} is down"
          description: "The CloudNativePG instance is not ready, not scrapable, or reports PostgreSQL down, for 2 minutes."

  - name: lab.observability
    rules:
      - alert: LabLokiIngestionErrors
        expr: |
          sum by (namespace, job) (rate(loki_discarded_samples_total[5m])) > 0
            or
          sum by (namespace, job) (rate(loki_request_duration_seconds_count{route=~"loki_api_v1_push|otlp_v1_logs", status_code=~"5.."}[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Loki is dropping or failing log pushes"
          description: "Loki discarded samples or answered pushes with 5xx for 10 minutes."
      - alert: LabAlloyLogSendErrors
        expr: sum by (namespace, job) (rate(loki_write_dropped_entries_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Alloy is dropping log entries on the way to Loki"
          description: "loki.write in Alloy dropped entries for 10 minutes."
      - alert: LabTempoIngestionErrors
        expr: |
          sum by (namespace, job) (rate(tempo_discarded_spans_total[5m])) > 0
            or
          sum by (namespace, job) (rate(otelcol_exporter_send_failed_spans_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Spans are being dropped on the way to Tempo"
          description: "Tempo discarded spans, or Alloy failed to export spans, for 10 minutes."
      - alert: LabPrometheusIngestionErrors
        expr: |
          sum by (namespace, job) (rate(prometheus_remote_storage_samples_failed_total[5m])) > 0
            or
          sum by (namespace, job) (rate(prometheus_tsdb_head_samples_appended_total[5m])) == 0
            or
          sum by (namespace, job) (rate(prometheus_target_scrapes_sample_out_of_order_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus ingestion problem ({{ $labels.job }})"
          description: "Remote write is failing, samples are rejected as out of order, or nothing is being appended."
      - alert: LabRemoteWriteReceiveErrors
        expr: sum by (namespace, job) (rate(prometheus_http_requests_total{handler="/api/v1/write", code=~"5.."}[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus rejects remote-write requests"
          description: "The remote-write receiver (k6, Tempo, Alloy) answered with 5xx for 10 minutes."

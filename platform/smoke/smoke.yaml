# Fixtures for scripts/smoke.sh. Applied while it runs and deleted afterwards
# (except the smoke-data PV, which proves host data survives a cluster rebuild).
apiVersion: v1
kind: Namespace
metadata:
  name: smoke
  labels:
    app.kubernetes.io/part-of: lab
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: smoke-other
  labels:
    app.kubernetes.io/part-of: lab
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: smoke
  labels: {app.kubernetes.io/name: whoami, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: smoke}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: whoami}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: whoami, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: smoke}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: whoami
          image: ${WHOAMI_IMAGE}
          args: [--port, "8080"]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5}
          resources: {requests: {cpu: 5m, memory: 16Mi}, limits: {cpu: 100m, memory: 32Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: smoke
  labels: {app.kubernetes.io/name: whoami, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: smoke}
spec:
  selector: {app.kubernetes.io/name: whoami}
  ports: [{name: http, port: 8080, targetPort: http}]
---
# The contract's app NetworkPolicy shape: deny by default, app port from Traefik pods only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: smoke}
spec: {podSelector: {}, policyTypes: [Ingress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: whoami, namespace: smoke}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: whoami}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: traefik}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports: [{port: 8080, protocol: TCP}]
---
# Public routes, exactly like storage's: strip-identity only, higher priority.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: whoami-public, namespace: smoke}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`whoami.${DOMAIN}`) && (PathPrefix(`/s/`) || PathPrefix(`/api/public/`) || PathPrefix(`/assets/`) || Path(`/favicon.svg`))
      kind: Rule
      priority: 100
      middlewares: [{name: strip-identity, namespace: auth}]
      services: [{name: whoami, port: 8080}]
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: whoami, namespace: smoke}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`whoami.${DOMAIN}`)
      kind: Rule
      priority: 10
      middlewares: [{name: sso-chain, namespace: auth}]
      services: [{name: whoami, port: 8080}]
  tls: {}

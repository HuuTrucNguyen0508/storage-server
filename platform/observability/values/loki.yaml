# Loki (chart version pinned in install.sh): one single-binary replica, filesystem
# storage on a PVC, 7 days retention enforced by the compactor.
deploymentMode: SingleBinary
fullnameOverride: loki
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 168h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_cache_freshness_per_query: 10m
    split_queries_by_interval: 15m
    query_timeout: 300s
    volume_enabled: true
    allow_structured_metadata: true
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
    per_stream_rate_limit: 8MB
    per_stream_rate_limit_burst: 16MB
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
    compaction_interval: 10m
    retention_delete_delay: 2h
  pattern_ingester:
    enabled: false
  ui:
    enabled: false
  analytics:
    reporting_enabled: false
  podLabels:
    app.kubernetes.io/part-of: lab

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1536Mi}
  extraEnv:
    - name: GOMEMLIMIT
      value: 1200MiB

# Everything the scalable modes need is off.
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
ingester: {replicas: 0}
querier: {replicas: 0}
queryFrontend: {replicas: 0}
queryScheduler: {replicas: 0}
distributor: {replicas: 0}
compactor: {replicas: 0}
indexGateway: {replicas: 0}
bloomGateway: {replicas: 0}
bloomPlanner: {replicas: 0}
bloomBuilder: {replicas: 0}
patternIngester: {replicas: 0}
ruler: {enabled: false, replicas: 0}
overridesExporter: {enabled: false, replicas: 0}
gateway: {enabled: false}
minio: {enabled: false}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
sidecar:
  rules:
    enabled: false

monitoring:
  serviceMonitor:
    enabled: true
    metricsInstance:
      enabled: false
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  dashboards: {enabled: false}
  rules: {enabled: false}

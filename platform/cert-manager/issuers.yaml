# The root CA key lives in .local/ca.key (generated once by scripts/secrets.sh) and
# is loaded into secret cert-manager/lab-root-ca, so browsers trust it across rebuilds.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-ca
  labels: {app.kubernetes.io/name: lab-ca, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: tls}
spec:
  ca:
    secretName: lab-root-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-wildcard
  namespace: traefik
  labels: {app.kubernetes.io/name: lab-wildcard, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: tls}
spec:
  secretName: lab-wildcard-tls
  commonName: "*.${DOMAIN}"
  dnsNames: ["*.${DOMAIN}", "${DOMAIN}"]
  duration: 2160h
  renewBefore: 360h
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
  # lab-ca locally; letsencrypt-dns01 in the remote profile (CERT_ISSUER).
  issuerRef: {kind: ClusterIssuer, name: ${CERT_ISSUER}}

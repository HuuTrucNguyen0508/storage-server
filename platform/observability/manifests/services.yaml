# Stable Service names from the platform contract: prometheus.monitoring:9090 (k6 remote
# write, Tempo and Alloy remote write, Grafana) and alertmanager.monitoring:9093.
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels: {app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: metrics}
spec:
  selector:
    app.kubernetes.io/name: prometheus
    operator.prometheus.io/name: kps-prometheus
  ports:
    - {name: http-web, port: 9090, targetPort: 9090}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels: {app.kubernetes.io/name: alertmanager, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: alerting}
spec:
  selector:
    app.kubernetes.io/name: alertmanager
    alertmanager: kps-alertmanager
  ports:
    - {name: http-web, port: 9093, targetPort: 9093}

# Nightly pg_dump of the metadata database to the host-backed storage-backups
# claim, keeping the newest 7. File contents need no backup job: storage-data
# is on the host. `make backup` / `make restore` drive this CronJob.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: storage-db-backup
  labels: {app.kubernetes.io/name: storage, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: db-backup}
spec:
  schedule: "0 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {app.kubernetes.io/name: storage, app.kubernetes.io/part-of: lab, app.kubernetes.io/component: db-backup}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: backup
              image: ${POSTGRES_CLIENT_IMAGE}
              env:
                - name: DATABASE_URL
                  valueFrom: {secretKeyRef: {name: storage-db-app, key: uri}}
              command:
                - sh
                - -c
                - |
                  set -eu
                  f="/backups/storage-$(date -u +%Y%m%dT%H%M%SZ).dump"
                  # kube-router admits a new pod to the database a moment after it starts, so wait.
                  i=0; until pg_isready -q -d "$DATABASE_URL"; do
                    i=$((i + 1)); [ "$i" -lt 60 ] || { echo "the database is not reachable" >&2; exit 1; }; sleep 1
                  done
                  pg_dump --format=custom --file="$f.partial" "$DATABASE_URL"
                  mv "$f.partial" "$f"
                  ls -1 /backups | grep -E '^storage-[0-9]{8}T[0-9]{6}Z\.dump$' | sort -r | tail -n +8 | sed 's|^|/backups/|' | xargs -r rm -f
                  echo "wrote $f ($(wc -c < "$f") bytes)"
              resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 256Mi}}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
              volumeMounts:
                - {name: backups, mountPath: /backups}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - {name: backups, persistentVolumeClaim: {claimName: storage-backups}}
            - {name: tmp, emptyDir: {}}
